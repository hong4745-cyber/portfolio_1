    <script>
      // Hero의 Spline 씬에 내장된 사운드 액션을 재생 전에 무음 처리한다.
      // spline-viewer에는 음소거 API가 없어 Web Audio 컨텍스트 단에서 막는다.
      (function () {
        const silence = (Ctor) => {
          if (!Ctor) return Ctor
          return new Proxy(Ctor, {
            construct(target, args) {
              const ctx = new target(...args)
              ctx.suspend?.()
              ctx.resume = () => Promise.resolve()
              return ctx
            },
          })
        }
        window.AudioContext = silence(window.AudioContext)
        window.webkitAudioContext = silence(window.webkitAudioContext)
      })()
    </script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
